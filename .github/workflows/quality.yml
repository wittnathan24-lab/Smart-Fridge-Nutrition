name: Quality
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m ruff check main.py auth.py config.py database.py demo.py middleware.py models.py personal.py schemas.py services tests
      - run: python -m ruff format --check main.py auth.py config.py database.py demo.py middleware.py models.py personal.py schemas.py services tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - run: git diff --exit-code -- static/tailwind.css
